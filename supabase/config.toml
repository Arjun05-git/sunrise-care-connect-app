# Supabase CLI local config (excerpt). `supabase start` for local dev; link to an
# ap-south-1 (Mumbai) project for staging/production.
project_id = "sunrise-care-connect"

[api]
port = 54321
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173", "capacitor://localhost"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Staff passwords (patients and doctors use phone OTP). The admin console also requires TOTP MFA
# (app_settings.staff_mfa_required, missing = required).
minimum_password_length = 12
password_requirements = "letters_digits"


[auth.rate_limit]
sms_sent = 30
token_verifications = 30

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "30s"
otp_length = 6
otp_expiry = 300

# No fixed test OTPs here: this file can be pushed to a hosted project (`supabase config push`), and a
# fixed code for a real-format number is a standing login for whoever owns it. The local stack injects
# its test numbers through GOTRUE_SMS_TEST_OTP (scripts/local-stack/up.sh) instead.

# OTP abuse: the Send SMS hook (functions/auth-sms-hook) only texts Indian mobiles and limits each number
# to 5 codes / 15 min and 10 / day. Set SEND_SMS_HOOK_SECRET on the function to the hook's secret.
[auth.hook.send_sms]
enabled = false   # true on hosted projects
uri = "https://<project-ref>.supabase.co/functions/v1/auth-sms-hook"
# secrets = "env(SEND_SMS_HOOK_SECRET)"

# Bot protection for OTP requests: recommended in production; needs a captcha widget on the login screen first (docs/SECURITY.md).
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "env(TURNSTILE_SECRET_KEY)"

[auth.email]
enable_signup = false

[auth.mfa]
max_enrolled_factors = 3
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
file_size_limit = "10MiB"

# Webhooks carry no user JWT – they are verified by signature instead.
[functions.payments-webhook]
verify_jwt = false
[functions.video-webhook]
verify_jwt = false
[functions.notifications-webhook]
verify_jwt = false
[functions.prescription-verify]
verify_jwt = false
[functions.auth-sms-hook]
verify_jwt = false
