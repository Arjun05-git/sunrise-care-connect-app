# Supabase CLI local config (excerpt). `supabase start` for local dev; link to an
# ap-south-1 (Mumbai) project for staging/production.
project_id = "sunrise-care-connect"

[api]
port = 54321
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
# Reference data only (master tables + safe defaults): it is the one seed that is fit for any environment, including
# `supabase db push --include-seed` to a hosted project. The demo hospital (known logins) is loaded on purpose, into a
# database declared as demo - see docs/LOCAL_TESTING.md. supabase/seed/demo.sql refuses to run anywhere else.
sql_paths = ["./seed/reference.sql"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173", "capacitor://localhost"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Staff passwords (patients and doctors use phone OTP). The admin console also requires TOTP MFA
# (always in production; only a database with app.environment = 'demo' may relax it - see migration 019).
minimum_password_length = 12
password_requirements = "letters_digits"


[auth.rate_limit]
sms_sent = 30
token_verifications = 30

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "30s"
otp_length = 6
otp_expiry = 300

# No fixed test OTPs here: this file can be pushed to a hosted project (`supabase config push`), and a
# fixed code for a real-format number is a standing login for whoever owns it. The local stack injects
# its test numbers through GOTRUE_SMS_TEST_OTP (scripts/local-stack/up.sh) instead.

# OTP abuse: the Send SMS hook (functions/auth-sms-hook) only texts Indian mobiles and limits each number
# to 5 codes / 15 min and 10 / day. Set SEND_SMS_HOOK_SECRET on the function to the hook's secret.
[auth.hook.send_sms]
enabled = false   # true on hosted projects
uri = "https://<project-ref>.supabase.co/functions/v1/auth-sms-hook"
# secrets = "env(SEND_SMS_HOOK_SECRET)"

# Bot protection for OTP requests: recommended in production; needs a captcha widget on the login screen first (docs/SECURITY.md).
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "env(TURNSTILE_SECRET_KEY)"

[auth.email]
enable_signup = false

[auth.mfa]
max_enrolled_factors = 3
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
file_size_limit = "10MiB"

# Webhooks carry no user JWT – they are verified by signature instead.
[functions.payments-webhook]
import_map = "./functions/deno.json"
verify_jwt = false
[functions.video-webhook]
import_map = "./functions/deno.json"
verify_jwt = false
[functions.notifications-webhook]
import_map = "./functions/deno.json"
verify_jwt = false
[functions.prescription-verify]
import_map = "./functions/deno.json"
verify_jwt = false
[functions.auth-sms-hook]
import_map = "./functions/deno.json"
verify_jwt = false

# Every function resolves npm packages through the shared import map (needed by `supabase functions deploy`).
[functions.abha]
import_map = "./functions/deno.json"
[functions.admin-users]
import_map = "./functions/deno.json"
[functions.doctor-signature]
import_map = "./functions/deno.json"
[functions.documents-register]
import_map = "./functions/deno.json"
[functions.integrations-dispatch]
import_map = "./functions/deno.json"
[functions.notifications-dispatch]
import_map = "./functions/deno.json"
[functions.payments-create-order]
import_map = "./functions/deno.json"
[functions.payments-mock-checkout]
import_map = "./functions/deno.json"
[functions.payments-receipt]
import_map = "./functions/deno.json"
[functions.payments-refund]
import_map = "./functions/deno.json"
[functions.payments-verify]
import_map = "./functions/deno.json"
[functions.prescription-pdf]
import_map = "./functions/deno.json"
[functions.video-token]
import_map = "./functions/deno.json"
